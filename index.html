<title>Formation Harcèlement CAPSULE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<style>
/* Layout : scène 16:9 de 1280×720 mise à l'échelle de la fenêtre ; diapositives claires, ouvertures et clôtures sombres. */
:root{
  --navy:#17365D; --deep:#0B1F3A; --mag:#C21790; --cyan:#00A3BC; --cyanl:#E7F8FB; --magl:#FDF0FA;
  --txt:#2F3A47; --muted:#5E6B7A; --row:#F3F6F8; --bd:#CFD6DE; --cy2:#5FD8EA; --amb:#B87400; --ambl:#FFF4DB; --ok:#0A7F5A; --okl:#E3F6EF;
  --font:'Lato','Carlito','Calibri','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--deep);color:var(--txt);font-family:var(--font);overflow:hidden;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font-family:inherit}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:56px}
#stage{position:relative;width:1280px;height:720px;flex:none;transform-origin:center center;background:#fff;overflow:hidden;box-shadow:0 20px 80px rgba(0,0,0,.45);border-radius:6px}
.slide{position:absolute;inset:0;display:none;background:#fff}
.slide.on{display:block;animation:sin .35s ease both}
@keyframes sin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.slide.back.on{animation-name:sinb}
@keyframes sinb{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
/* en-tête et pied */
.hd{position:absolute;left:0;right:0;top:0;height:64px;padding:0 56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd)}
.hd img{height:34px}
.hd .pt{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.ft{position:absolute;left:56px;right:56px;bottom:0;height:40px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);border-top:1px solid var(--bd)}
.ft b{color:var(--navy)}
.body{position:absolute;left:56px;right:56px;top:86px;bottom:56px;display:flex;flex-direction:column;gap:16px;min-height:0}
.k{font-size:15px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
h2{margin:0;font-size:38px;line-height:1.12;font-weight:900;color:var(--deep);letter-spacing:-.01em;text-wrap:balance}
h2 em{font-style:normal;color:var(--mag)}
.lead{font-size:24px;line-height:1.45;color:var(--txt)}
/* révélations */
.rv{opacity:0;transform:translateY(14px);transition:opacity .45s ease,transform .45s ease;pointer-events:none}
.rv.in{opacity:1;transform:none;pointer-events:auto}
/* cartes */
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:18px 22px}
.card.t-c{border-top:6px solid var(--cyan)} .card.t-m{border-top:6px solid var(--mag)} .card.t-n{border-top:6px solid var(--navy)}
.ico{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--cyan));color:#fff}
.ico.m{background:linear-gradient(135deg,var(--mag),#E640B6)}
.ico svg{width:24px;height:24px}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.12em}
.note{background:var(--cyanl);border-left:8px solid var(--cyan);border-radius:14px;padding:14px 22px;font-size:23px;line-height:1.4;color:var(--navy)}
.note.m{background:var(--magl);border-left-color:var(--mag)}
.note b{color:var(--deep)}
.li{display:flex;gap:14px;align-items:flex-start;font-size:25px;line-height:1.35;padding:9px 0}
.li svg{margin-top:5px;font-size:22px;color:var(--cyan)}
.li.m svg{color:var(--mag)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.row{display:flex;gap:18px;min-height:0}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{appearance:none;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;font-weight:800;font-size:21px;padding:9px 22px;cursor:pointer;transition:all .15s}
.btn:hover{background:var(--navy);color:#fff}
.btn.p{background:var(--mag);border-color:var(--mag);color:#fff}.btn.p:hover{background:#9E1075;border-color:#9E1075}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
/* diapositives sombres */
.dark{background:var(--deep) center/cover no-repeat;color:#fff}
.dark::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(11,31,58,.97),rgba(11,31,58,.9) 55%,rgba(11,31,58,.72))}
.dark>*{position:relative}
.chip{position:absolute;left:56px;top:40px;background:#fff;border-radius:14px;padding:10px 18px}
.chip img{height:48px;display:block}
.dk-k{font-size:18px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--cy2)}
/* couverture */
.cover h1{position:absolute;left:72px;top:210px;width:900px;margin:0;font-size:62px;line-height:1.05;font-weight:900;letter-spacing:-.02em}
.cover .tag{position:absolute;left:72px;top:420px;font-size:36px;font-weight:900;display:flex;gap:18px;flex-wrap:wrap}
.cover .tag span{color:var(--cy2);opacity:0;animation:up .6s ease forwards}
.cover .tag span:nth-child(2){animation-delay:.25s}.cover .tag span:nth-child(3){animation-delay:.5s}.cover .tag span:nth-child(4){animation-delay:.75s;color:#fff}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.cover .sub{position:absolute;left:72px;top:488px;width:760px;font-size:24px;line-height:1.45;color:#DDE6F0}
.cover .go{position:absolute;left:72px;top:610px}
.cover .meta{position:absolute;right:56px;top:52px;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:8px 20px;font-weight:700;letter-spacing:.08em;font-size:15px}
.cover .go .btn{border-color:#fff;color:#fff;background:transparent;font-size:20px;padding:12px 30px}.cover .go .btn:hover{background:#fff;color:var(--deep)}
/* séparateurs de parties */
.div .num{position:absolute;left:72px;top:150px;font-size:190px;line-height:1;font-weight:900;color:transparent;-webkit-text-stroke:3px var(--cy2)}
.div h1{position:absolute;left:72px;top:360px;width:860px;margin:0;font-size:54px;line-height:1.08;font-weight:900}
.div .meta{position:absolute;left:72px;top:530px;font-size:22px;color:var(--cy2);font-weight:700;display:flex;gap:26px}
.div .bar{position:absolute;left:72px;right:72px;bottom:60px;display:flex;gap:6px}
.div .bar i{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.2)}.div .bar i.cur{background:var(--cy2)}.div .bar i.done{background:rgba(255,255,255,.65)}
/* barre de contrôle */
#ctl{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:10px;padding:0 max(16px,env(safe-area-inset-left,0px));background:#071526;color:#fff;z-index:20}
#ctl button{appearance:none;border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;border-radius:10px;height:38px;min-width:42px;padding:0 12px;display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700;cursor:pointer}
#ctl button:hover{background:rgba(255,255,255,.14)}
#ctl svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#prog{flex:1;display:flex;gap:3px;align-items:center;min-width:60px}
#prog i{flex:1;height:10px;border-radius:3px;background:rgba(255,255,255,.2);cursor:pointer;position:relative}
#prog i.done{background:rgba(95,216,234,.7)}#prog i.cur{background:#fff}
#prog i:hover{background:var(--cy2)}
#cnt{font-size:15px;font-weight:700;white-space:nowrap;min-width:62px;text-align:center}
#stepchip{font-size:13px;font-weight:700;color:var(--cy2);white-space:nowrap}
/* vue d'ensemble */
#ov{position:fixed;inset:0;background:rgba(7,21,38,.97);z-index:30;overflow:auto;padding:28px max(24px,env(safe-area-inset-left,0px)) 80px}
#ov h3{margin:0 0 4px;color:#fff;font-size:26px}
#ov .pn{margin:22px 0 10px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--cy2);font-weight:900}
#ov .gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
#ov button{text-align:left;background:#0F2A4A;border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;font-size:14px;line-height:1.3;min-height:58px;display:flex;gap:10px;align-items:flex-start}
#ov button b{color:var(--cy2);min-width:24px}
#ov button:hover{background:#17365D}
#ov .x{position:fixed;right:20px;top:16px;width:auto;min-height:0;padding:8px 16px;font-weight:800}
/* minuteur */
#tm{position:absolute;right:330px;top:7px;z-index:5;display:none;align-items:center;gap:8px;background:var(--deep);color:#fff;border-radius:999px;padding:4px 8px 4px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#tm.on{display:flex}
#tm .t{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;min-width:86px;text-align:center}
#tm button{appearance:none;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;height:34px;min-width:34px;font-weight:800;font-size:15px;cursor:pointer;padding:0 10px}
#tm button:hover{background:rgba(255,255,255,.3)}
#tm.end .t{color:#FF8AD8;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.slide.on,.cover .tag span,#tm.end .t{animation:none}.cover .tag span{opacity:1}.rv{transition:none}}
@media (max-width:640px){#ctl .lbl{display:none}#stepchip{display:none}}
/* ---------- composants spécifiques ---------- */
.q5 .li{font-size:26px;padding:10px 0;border-bottom:1px dashed var(--bd)}
.prompt{background:var(--deep);color:#fff;border-radius:18px;padding:20px 24px}
.prompt .dk-k{margin-bottom:8px}.prompt p{margin:0;font-size:25px;line-height:1.4}
.pad{display:flex;gap:8px;margin-top:12px}
.pad input{flex:1;min-width:0;border:0;border-radius:10px;padding:10px 12px;font:inherit;font-size:19px}
.pad button{appearance:none;border:0;background:var(--cy2);color:var(--deep);font-weight:900;font-size:18px;border-radius:10px;padding:0 16px;cursor:pointer}
.stk{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;min-height:12px}
.stk span{background:var(--cyanl);color:var(--navy);border-radius:8px;padding:7px 12px;font-size:18px;font-weight:700;animation:pop .3s ease;transform:rotate(var(--r,0deg))}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.obj{display:flex;gap:14px;align-items:center;padding:18px 20px}
.obj b{font-size:26px;line-height:1.2;color:var(--deep)}
.def .h{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.def h3{margin:0;font-size:31px;line-height:1.1;color:var(--deep)}
.def p{margin:0;font-size:22px;line-height:1.45}
.ref{display:inline-block;margin-top:12px;background:var(--row);border-radius:8px;padding:4px 10px;font-size:17px;font-weight:800;color:var(--navy);letter-spacing:.04em}
.tags{display:flex;gap:10px;flex-wrap:wrap}
.tags span{background:var(--deep);color:#fff;border-radius:999px;padding:9px 20px;font-weight:800;font-size:23px}
.quote{font-size:28px;line-height:1.35;font-weight:700;color:var(--deep);font-style:italic}
.quote::before{content:"«\00a0"}.quote::after{content:"\00a0»"}
.sit h4{margin:0 0 4px;font-size:17px;letter-spacing:.16em;color:var(--cyan);text-transform:uppercase}
.sit p{margin:0 0 12px;font-size:20px;line-height:1.35;color:var(--deep);font-weight:700}
.opt{display:block;width:100%;text-align:left;appearance:none;background:var(--row);border:2px solid var(--bd);border-radius:12px;padding:7px 14px;margin-bottom:6px;font-size:17px;font-weight:700;color:var(--navy);cursor:pointer;line-height:1.25;transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--navy);background:#fff}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okl);border-color:var(--ok);color:#06553C}
.opt.ko{background:var(--magl);border-color:var(--mag);color:#8F0F68}
.fb{font-size:15px;line-height:1.35;border-radius:10px;padding:8px 12px;margin-top:2px;display:none}
.fb.on{display:block;animation:pop .25s ease}
.fb.ok{background:var(--okl);color:#06553C}.fb.ko{background:var(--magl);color:#8F0F68}
.tbl{width:100%;border-collapse:separate;border-spacing:0 8px}
.tbl td{padding:12px 20px;font-size:24px;line-height:1.3;vertical-align:middle}
.tbl td:first-child{font-weight:900;color:#fff;width:300px;border-radius:12px 0 0 12px}
.tbl td:last-child{background:var(--row);border-radius:0 12px 12px 0}
.sig{display:flex;gap:16px;align-items:flex-start}
.sig h3,.rsp h3{margin:0 0 4px;font-size:27px;color:var(--deep);line-height:1.15}.sig p,.rsp p{margin:0;font-size:22px;line-height:1.4}
.stp{display:flex;gap:14px;align-items:flex-start}
.stp .n{flex:none;width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;font-weight:900;font-size:25px;display:flex;align-items:center;justify-content:center}
.stp.m .n{background:var(--mag)}
.stp p{margin:0;font-size:25px;line-height:1.3;padding-top:7px}
.story p{margin:0 0 10px;font-size:22px;line-height:1.5}
.story .s{cursor:pointer;border-radius:6px;padding:1px 3px;transition:background .15s;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.story .s:hover{background:#D9F1F6}.story .s.hl{background:#9FE6F2;color:var(--deep)}
.qlist .li{font-size:22px;padding:6px 0}
.corr{position:absolute;left:-56px;right:-56px;bottom:-56px;background:var(--deep);color:#fff;border-radius:20px 20px 0 0;padding:22px 56px 100px;transform:translateY(112%);transition:transform .45s ease;z-index:4;font-size:23px;line-height:1.5}
.corr.on{transform:none}
.corr b{color:var(--cy2)}
.corr .cl{margin:6px 0 0;padding-left:24px;font-size:21px;line-height:1.4}.corr .cl li{margin-bottom:8px;break-inside:avoid}
.pill{font-weight:900;font-size:18px;letter-spacing:.06em}
.ph{display:flex;gap:12px;align-items:center}
.big{font-size:60px;line-height:1;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
.flip{position:relative;cursor:pointer;min-height:84px}
.flip .a,.flip .b{padding:16px 22px;border-radius:14px;font-size:24px;line-height:1.3;display:flex;gap:12px;align-items:center}
.flip .a{background:var(--magl);border:2px solid var(--mag);color:#7C0D58;font-style:italic;font-weight:700}
.flip .b{background:var(--okl);border:2px solid var(--ok);color:#06553C;font-weight:700;display:none}
.flip.on .a{display:none}.flip.on .b{display:flex;animation:pop .25s ease}
.fr{display:grid;grid-template-columns:1fr;gap:10px}
.act{display:inline-flex;gap:8px;align-items:center;appearance:none;background:#fff;border:2px solid var(--navy);color:var(--navy);border-radius:999px;font-weight:800;font-size:18px;padding:5px 14px;cursor:pointer;text-align:left;line-height:1.2}
.act.sel{background:var(--navy);color:#fff;box-shadow:0 0 0 4px var(--cyanl)}
.act.put{border-color:var(--cyan);background:var(--cyanl);font-size:14px;padding:3px 10px;line-height:1.15;white-space:nowrap}
.act.put:hover{background:#fff;border-color:var(--mag)}
.zone{min-height:150px;border:2px dashed var(--bd);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--row);cursor:pointer;transition:all .15s}
.zone.hot{border-color:var(--cyan);background:var(--cyanl)}
.zone h4{margin:0 0 2px;font-size:22px;color:var(--deep);display:flex;gap:8px;align-items:center}
.ch{display:flex;gap:14px;align-items:flex-start}
.ch .n{flex:none;width:50px;height:50px;border-radius:50%;background:var(--navy);color:#fff;font-weight:900;font-size:28px;display:flex;align-items:center;justify-content:center}
.avoid{display:flex;gap:12px;align-items:flex-start;font-size:23px;line-height:1.3;padding:14px 16px;background:var(--row);border-radius:12px}
.avoid svg{font-size:27px;color:var(--mag);margin-top:2px}
.flow5{display:flex;gap:0;align-items:stretch}
.flow5 .c{flex:1;position:relative;padding:18px 18px 18px 22px;color:#fff;min-height:250px}
.flow5 .c h3{margin:6px 0 8px;font-size:25px;line-height:1.15}.flow5 .c p{margin:0;font-size:19px;line-height:1.38;opacity:.95}
.flow5 .c .nn{font-size:17px;font-weight:900;letter-spacing:.14em;opacity:.8}
.flow5 .c:first-child{border-radius:16px 0 0 16px}.flow5 .c:last-child{border-radius:0 16px 16px 0}
.lvl{border-radius:18px;padding:22px 26px;display:flex;gap:22px;align-items:center;color:#fff}
.lvl h3{margin:0 0 4px;font-size:30px}.lvl .s{font-size:19px;font-weight:900;letter-spacing:.06em;opacity:.9;text-transform:uppercase}.lvl p{margin:0;font-size:23px;line-height:1.35}
.lvl .bg{flex:none;font-size:64px;font-weight:900;opacity:.35;line-height:1}
.aud{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:14px 20px;border-radius:14px;background:var(--row)}
.aud p{margin:0;font-size:25px;line-height:1.3;color:var(--deep);font-weight:700}
.tri{display:flex;gap:6px}
.tri button{appearance:none;border:2px solid var(--bd);background:#fff;border-radius:999px;padding:7px 14px;font-size:18px;font-weight:800;cursor:pointer;color:var(--muted)}
.tri button:hover{border-color:var(--navy);color:var(--navy)}
.tri button.s0.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tri button.s1.on{background:var(--amb);border-color:var(--amb);color:#fff}
.tri button.s2.on{background:var(--mag);border-color:var(--mag);color:#fff}
.field label{display:block;font-size:15px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:8px 0 3px}
.field input,.field textarea{width:100%;border:2px solid var(--bd);border-radius:10px;padding:8px 10px;font:inherit;font-size:19px;background:#fff;color:var(--txt)}
.field textarea{resize:none;height:130px;line-height:1.35}
.field input:focus,.field textarea:focus{border-color:var(--cyan);outline:none}
.qz{padding:10px 16px;display:flex;flex-direction:column;gap:6px}
.qz .t{font-size:13px;letter-spacing:.16em;font-weight:900;color:var(--cyan)}
.qz p{margin:0;font-size:18px;line-height:1.3;font-weight:700;color:var(--deep)}
.qz .yn{display:flex;gap:8px}
.qz .yn button{flex:1;appearance:none;border:2px solid var(--bd);background:var(--row);border-radius:10px;padding:6px;font-size:17px;font-weight:900;color:var(--navy);cursor:pointer}
.qz .yn button.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.qz.rok{border-color:var(--ok);background:var(--okl)}.qz.rko{border-color:var(--mag);background:var(--magl)}
.qz .ex{font-size:14px;line-height:1.35;display:none}.qz.rok .ex,.qz.rko .ex{display:block}
.qz .yn button.good{background:var(--ok);border-color:var(--ok);color:#fff}
.qz .yn button.bad{background:var(--mag);border-color:var(--mag);color:#fff}
.score{display:none;align-items:center;gap:18px}.score.on{display:flex;animation:pop .3s ease}
.score .big{color:var(--deep);font-size:52px}
.rf{display:flex;gap:16px;align-items:center}
.rf .nb{flex:none;font-size:57px;font-weight:900;color:var(--cyan);line-height:1;min-width:76px}
.rf h3{margin:0 0 4px;font-size:30px;color:var(--deep)}.rf p{margin:0;font-size:22px;line-height:1.35}
</style>

<div id="viewport"><div id="stage" role="region" aria-label="Diaporama"><div id="tm" aria-label="Minuteur"><button id="tmm" aria-label="Moins cinq minutes">−5</button><span class="t" id="tmt">10:00</span><button id="tmp" aria-label="Démarrer ou mettre en pause">Démarrer</button><button id="tmr" aria-label="Remettre à zéro">↺</button><button id="tmq" aria-label="Plus cinq minutes">+5</button></div></div></div>

 add({id:'p'+p.n,t:'Partie '+p.n+' · '+p.t,part:pi,cls:'dark div',bg:true,html:'<div class="chip"><img src="'+LOGO+'" alt="CAPSULE"></div><div class="num">'+p.n+'</div><div class="dk-k" style="position:absolute;left:72px;top:318px">Partie '+p.n+' sur 6</div><h1>'+p.t+'</h1><div class="meta"><span>'+p.r+'</span><span>'+p.d+'</span></div><div class="bar">'+bar+'</div>'})}
/* ---------- PARTIE 1 ---------- */
divider(0);
add({id:'s1',n:1,part:0,t:'Ouverture : harcèlement au travail, tout n\'est pas évident',html:frame(0,'Ouverture','Harcèlement au travail : et si tout n\'était pas <em>aussi évident</em> ?',
 '<div class="row" style="flex:1"><div class="col q5" style="flex:1.1;justify-content:center">'+
 ['Une remarque peut-elle devenir du harcèlement ?','Un manager exigeant est-il nécessairement harcelant ?','Peut-on harceler quelqu\'un sans en avoir conscience ?','Une plaisanterie peut-elle constituer un agissement sexiste ?','Pourquoi certaines personnes ne disent-elles rien ?'].map(function(q){return '<div class="li rv">'+I('msg')+'<span>'+q+'</span></div>'}).join('')+
 '</div><div class="col" style="flex:1;justify-content:center;gap:18px"><div class="prompt rv"><div class="dk-k">Question d\'ouverture aux participants</div><p style="font-size:26px">« Selon vous, qu\'est-ce qui rend une situation de harcèlement <b style="color:var(--cy2)">difficile à identifier</b> ? »</p></div><div class="rv">'+cbtn('c1')+'</div></div></div>'+
 drawer('c1','Pistes de réponse · pour le formateur',ul(['Les agissements sont souvent <b>discrets, indirects et progressifs</b>.','Ils se produisent parfois <b>sans témoin</b>.','La frontière avec le <b>management exigeant</b> ou le conflit paraît floue.','Les comportements sont <b>banalisés</b> (« c\'est l\'ambiance », « c\'est de l\'humour »).','Les personnes concernées <b>se taisent</b> : peur, honte, dépendance.','Les effets sur la santé et le travail apparaissent <b>avec retard</b>.'],2)),1)});
add({id:'s2',n:2,part:0,t:'Les objectifs de la journée',html:frame(0,'À l\'issue de la formation, vous saurez :','Les objectifs de la <em>journée</em>',
 '<div class="grid g3" style="flex:1;grid-template-rows:1fr 1fr">'+
 [['eye','Reconnaître les différentes formes de harcèlement.'],['scale','Distinguer conflit, maladresse, management inadapté et harcèlement.'],['alert','Identifier les comportements et les situations à risque.'],['users','Comprendre les responsabilités de chacun.'],['msg','Réagir face à un signalement.'],['shield','Contribuer à la prévention.']].map(function(o,i){return '<div class="card obj rv '+['t-c','t-m','t-n'][i%3]+'">'+ib(o[0],i%2)+'<b>'+o[1]+'</b></div>'}).join('')+'</div>',2)});
add({id:'s3',n:3,part:0,t:'De quoi parle-t-on exactement ?',html:frame(0,'Définitions','De quoi parle-t-on <em>exactement</em> ?',
 '<div class="grid g3" style="flex:1">'+
 [['Harcèlement moral','pulse','Des agissements <b>répétés</b> ayant pour objet ou pour effet une <b>dégradation des conditions de travail</b> susceptible de porter atteinte aux droits et à la dignité, d\'altérer la santé ou de compromettre l\'avenir professionnel.','L1152-1','t-n',0],
  ['Harcèlement sexuel','shield','Des propos ou comportements à <b>connotation sexuelle ou sexiste répétés</b> répondant aux critères légaux, ou certaines formes de <b>pression grave, même non répétée</b>, visant à obtenir un acte de nature sexuelle.','L1153-1','t-m',1],
  ['Agissements sexistes','users','Des agissements <b>liés au sexe</b> d\'une personne ayant pour objet ou pour effet de porter atteinte à sa dignité ou de créer un environnement <b>intimidant, hostile, dégradant, humiliant ou offensant</b>.','L1142-2-1','t-c',0]].map(function(d){return '<div class="card def rv '+d[4]+'"><div class="h">'+ib(d[1],d[5])+'<h3>'+d[0]+'</h3></div><p>'+d[2]+'</p><span class="ref">Code du travail · '+d[3]+'</span></div>'}).join('')+'</div>'+
 '<div style="font-size:17px;color:var(--muted)">Références : Code du travail, articles L1152-1, L1153-1 et L1142-2-1.</div>',3)});
add({id:'s4',n:4,part:0,t:'Harcèlement moral : comment le reconnaître ?',html:frame(0,'Harcèlement moral','Harcèlement moral : comment le <em>reconnaître</em> ?',
 '<div class="row" style="flex:1"><div class="col" style="flex:1.25"><div class="lead" style="font-size:22px;color:var(--muted)">Les situations susceptibles de constituer un harcèlement moral peuvent notamment prendre la forme de :</div>'+
 ['Critiques humiliantes et répétées.','Mise à l\'écart systématique.','Dévalorisation constante du travail.','Retrait injustifié de responsabilités.','Instructions contradictoires répétées.','Comportements visant à déstabiliser une personne.'].map(function(t){return li(t,0,'alert')}).join('')+'</div>'+
 '<div class="col" style="flex:1;justify-content:center"><div class="note m rv"><b>À retenir :</b> ce n\'est pas uniquement la nature d\'un acte qui compte. Il faut examiner la <b>répétition</b>, le <b>contexte</b> et les <b>effets possibles</b> sur les conditions de travail.</div><div class="tags rv" style="justify-content:center;margin-top:8px"><span>Répétition</span><span>Contexte</span><span>Effets</span></div></div></div>',4)});
add({id:'s5',n:5,part:0,t:'Harcèlement sexuel : ce qui doit alerter',html:frame(0,'Harcèlement sexuel','Harcèlement sexuel : ce qui doit <em>alerter</em>',
 '<div class="row" style="flex:1"><div class="col" style="flex:1.2"><div class="lead" style="font-size:22px;color:var(--muted)">Exemples :</div>'+
 li('Remarques répétées à connotation sexuelle.',0,'alert')+li('Messages ou sollicitations insistants à caractère sexuel.',0,'alert')+li('Commentaires répétés sur le corps d\'une personne.',0,'alert')+li('Propos sexualisés humiliants ou offensants.',0,'alert')+'<div class="li m rv" style="font-weight:900;color:#8F0F68">'+I('alert')+'<span>Pression grave pour obtenir une faveur sexuelle, même exercée une seule fois.</span></div></div>'+
 '<div class="col" style="flex:1;justify-content:center"><div class="card rv" style="font-size:22px;line-height:1.45">Le harcèlement sexuel peut également résulter de comportements provenant de <b>plusieurs personnes</b>, dans les conditions prévues par la loi.</div><div class="note m rv"><b>À retenir :</b> une pression grave exercée pour obtenir un acte de nature sexuelle peut suffire à caractériser une situation assimilée au harcèlement sexuel, <b>sans répétition</b>.</div></div></div>',5)});
add({id:'s6',n:6,part:0,t:'Les agissements sexistes',html:frame(0,'Quelques phrases qui doivent faire réfléchir','Les agissements <em>sexistes</em>',
 '<div class="grid g2" style="flex:1;grid-template-rows:1fr 1fr">'+['Les femmes sont trop émotives pour diriger.','Un homme, ça ne pleure pas.','Tu devrais sourire davantage, tu serais plus agréable.','Ce poste est trop physique pour une femme.'].map(function(q,i){return '<div class="card rv '+['t-m','t-n','t-c','t-m'][i]+'" style="display:flex;align-items:center;gap:18px"><div class="ico '+(i%2?'':'m')+'">'+I('msg')+'</div><div class="quote">'+q+'</div></div>'}).join('')+'</div>'+
 '<div class="note rv" style="font-size:22px">Les stéréotypes liés au sexe peuvent produire des comportements <b>dégradants ou discriminatoires</b>. La qualification juridique dépend des faits et de leur contexte. Un agissement sexiste peut être caractérisé <b>sans répétition</b>.</div>',6)});
add({id:'s7',n:7,part:0,t:'Les conséquences possibles',html:frame(0,'Conséquences','Les conséquences <em>possibles</em>',
 '<div class="grid g4" style="flex:1">'+[['heart','Sur la santé','Stress, anxiété, troubles du sommeil, épuisement','t-m',1],['users','Sur les équipes','Défiance, tensions, silence, perte de coopération','t-n',0],['briefcase','Sur le travail','Désengagement, absentéisme, départs','t-c',0],['building','Sur l\'entreprise','Responsabilité juridique, désorganisation, atteinte à la réputation','t-m',1]].map(function(c){return '<div class="card rv '+c[3]+'" style="display:flex;flex-direction:column;gap:14px">'+ib(c[0],c[4])+'<div style="font-size:30px;font-weight:900;color:var(--deep);line-height:1.1">'+c[1]+'</div><div style="font-size:24px;line-height:1.4">'+c[2]+'</div></div>'}).join('')+'</div>'+
 '<div class="note rv">Ces conséquences ne sont pas automatiques, mais elles justifient une <b>prévention active</b>.</div>',7)});
/* atelier situations */
function sit(i,txt,opts,right){return '<div class="card sit rv t-'+['c','m','n'][i]+'"><h4 style="margin-bottom:2px">Situation '+(i+1)+'</h4><p style="margin-bottom:8px">'+txt+'</p>'+opts.map(function(o,j){return '<button type="button" class="opt" data-sit="'+i+'" data-j="'+j+'" data-r="'+(j==right?1:0)+'">'+o[0]+'</button>'}).join('')+opts.map(function(o,j){return '<div class="fb" id="fb'+i+'_'+j+'">'+o[1]+'</div>'}).join('')+'</div>'}
add({id:'s8',n:8,part:0,timer:10,t:'Atelier : Harcèlement ou pas ?',html:frame(0,'Atelier','Atelier : « Harcèlement <em>ou pas</em> ? »',
 '<div class="lead rv" style="font-size:19px;line-height:1.35"><b>Consigne :</b> pour chaque situation, identifiez les faits, les informations manquantes et les risques éventuels. Ne cherchez pas à prononcer un jugement définitif.</div><div class="grid g3" style="flex:1;align-items:start">'+
 sit(0,'Un manager demande à son collaborateur de refaire un dossier jugé insuffisant.',[['Harcèlement moral certain','Un fait isolé et une exigence de qualité ne permettent pas de conclure à un harcèlement.'],['Pas nécessairement du harcèlement','Demander de refaire un travail jugé insuffisant relève en principe du pouvoir de direction. Il faudrait des agissements répétés, un contexte et des effets pour changer d\'analyse.'],['Harcèlement sexuel','Rien dans cette situation ne porte sur des propos ou comportements à connotation sexuelle.']],1)+
 sit(1,'Chaque semaine, un salarié est ridiculisé devant ses collègues, et ses responsabilités lui sont retirées sans explication.',[['Simple conflit','Les faits sont répétés, visent une seule personne et se produisent devant le collectif : on dépasse le simple désaccord.'],['Situation pouvant relever du harcèlement moral','Des agissements répétés (ridiculisation, retrait de responsabilités) peuvent dégrader les conditions de travail. La situation mérite un examen sérieux.'],['Management normal','Ridiculiser publiquement et retirer des responsabilités sans explication sort du cadre d\'un management normal.']],1)+
 sit(2,'Une responsable laisse entendre qu\'une promotion dépendra de l\'acceptation d\'une relation sexuelle.',[['Une maladresse','Conditionner une promotion à une relation sexuelle n\'est pas une maladresse.'],['Il faut nécessairement plusieurs propositions','Une pression grave pour obtenir un acte de nature sexuelle peut suffire, même exercée une seule fois.'],['Pression grave pouvant être assimilée à du harcèlement sexuel','La pression grave, même non répétée, peut être assimilée à du harcèlement sexuel.']],2)+'</div>',8)});
/* ---------- PARTIE 2 ---------- */
divider(1);
add({id:'s9',n:9,part:1,t:'Conflit, management exigeant ou harcèlement ?',html:frame(1,'Repères','Conflit, management exigeant ou <em>harcèlement</em> ?',
 '<table class="tbl" style="flex:none"><tbody>'+[['Désaccord professionnel','Des opinions ou des méthodes de travail différentes','#0090A8'],['Conflit interpersonnel','Des tensions entre personnes, parfois réciproques','#17708F'],['Management exigeant','Des objectifs, des contrôles et des critiques professionnelles justifiés','#17365D'],['Management inadapté','Des pratiques potentiellement excessives, injustes ou déstabilisantes','#7B2A8A'],['Harcèlement moral','Des agissements répétés répondant aux critères légaux','#C21790']].map(function(r){return '<tr class="rv"><td style="background:'+r[2]+'">'+r[0]+'</td><td>'+r[1]+'</td></tr>'}).join('')+'</tbody></table>'+
 '<div class="note m rv" style="margin-top:2px">Un conflit n\'est pas automatiquement du harcèlement. Mais <b>une situation de harcèlement peut se présenter sous l\'apparence d\'un simple conflit</b>.</div>',9)});
add({id:'s10',n:10,part:1,t:'Les signaux faibles',html:frame(1,'Repérer','Les signaux <em>faibles</em>',
 '<div class="grid g2" style="flex:1;grid-template-rows:1fr 1fr">'+[['user','Changements de comportement','Retrait, irritabilité, anxiété inhabituelle','t-c',0],['ban','Évitement','Refus de certaines réunions ou interactions','t-m',1],['users','Dégradation du collectif','Clans, silences, exclusion','t-n',0],['alert','Difficultés professionnelles','Erreurs, désengagement, absences répétées','t-m',1]].map(function(c){return '<div class="card sig rv '+c[3]+'" style="align-items:center">'+ib(c[0],c[4])+'<div><h3>'+c[1]+'</h3><p style="font-size:24px">'+c[2]+'</p></div></div>'}).join('')+'</div>'+
 '<div class="note rv">Ces signes peuvent avoir de nombreuses causes. Ils <b>ne prouvent pas un harcèlement</b>, mais peuvent justifier une écoute et une vigilance accrues.</div>',10)});
add({id:'s11',n:11,part:1,t:'Le harcèlement n\'est pas toujours visible',html:frame(1,'Comprendre','Le harcèlement n\'est pas toujours <em>visible</em>',
 '<div class="row" style="flex:1"><div class="col" style="flex:1.2;justify-content:center">'+['Il peut se produire sans témoin.','Il peut prendre la forme de comportements discrets ou indirects.','Il peut se développer progressivement.','Il peut être exercé par un supérieur, un collègue ou un subordonné.','Il peut se produire à distance, par messagerie ou lors d\'événements professionnels.'].map(function(t){return li(t,0,'eye')}).join('')+'</div>'+
 '<div class="col" style="flex:1"><div class="rv" style="flex:1;display:flex;align-items:center;background:var(--deep);color:#fff;border-radius:20px;padding:30px 34px;font-size:36px;line-height:1.25;font-weight:900"><div>L\'absence de plainte ne signifie pas <span style="color:var(--cy2)">l\'absence de problème.</span></div></div></div></div>',11)});
add({id:'s12',n:12,part:1,t:'Pourquoi certaines personnes ne parlent-elles pas ?',html:frame(1,'Comprendre le silence','Pourquoi certaines personnes <em>ne parlent-elles pas</em> ?',
 '<div class="grid g3" style="grid-template-rows:auto auto">'+[['lock','Peur de perdre leur emploi ou de subir des représailles.'],['msg','Crainte de ne pas être crues.'],['building','Dépendance hiérarchique ou économique.'],['heart','Honte, culpabilité ou sentiment d\'isolement.'],['flag','Méconnaissance des interlocuteurs.'],['ban','Banalisation des comportements.']].map(function(o,i){return '<div class="card rv" style="display:flex;gap:14px;align-items:center;padding:14px 18px">'+ib(o[0],i%2)+'<span style="font-size:22px;line-height:1.3;font-weight:700;color:var(--deep)">'+o[1]+'</span></div>'}).join('')+'</div>'+
 '<div class="prompt rv" style="margin-top:2px;display:flex;gap:24px;align-items:center;justify-content:space-between"><div><div class="dk-k">Question au groupe</div><p style="font-size:24px">« Que peut faire une entreprise pour qu\'un salarié se sente suffisamment en sécurité pour signaler une situation ? »</p></div><div style="flex:none">'+cbtn('c12')+'</div></div>'+
 drawer('c12','Pistes de réponse · pour le formateur',ul(['Un <b>dispositif de signalement connu</b> de tous (RH, référents, CSE).','Un <b>engagement clair de la direction</b> et des règles de comportement.','Des managers <b>formés à accueillir une alerte</b>.','La <b>protection contre les représailles</b>.','Un traitement <b>impartial</b> et des suites expliquées.','Une <b>réaction rapide</b> aux premières alertes.'],2)),12)});
add({id:'s13',n:13,part:1,t:'Le rôle du témoin',html:frame(1,'Face à une situation préoccupante','Le rôle du <em>témoin</em>',
 '<div class="row" style="flex:1"><div class="col" style="flex:1.35;justify-content:center;gap:12px">'+['Ne pas banaliser les faits.','Soutenir la personne sans lui imposer une démarche.','Noter les faits directement observés.','Utiliser les canaux de signalement adaptés.','Ne pas propager de rumeurs ni mener une enquête personnelle.'].map(function(t,i){return '<div class="stp rv'+(i%2?' m':'')+'"><div class="n">'+(i+1)+'</div><p>'+t+'</p></div>'}).join('')+'</div>'+
 '<div class="col" style="flex:1;justify-content:center"><div class="note rv" style="font-size:26px;padding:24px 28px">Un témoin n\'a pas à <b>qualifier juridiquement</b> les faits pour faire remonter une situation préoccupante.</div></div></div>',13)});
function sp(t){return '<span class="s">'+t+'</span>'}
add({id:'s14',n:14,part:1,timer:15,t:'Atelier : La frontière invisible',html:frame(1,'Étude de cas · Le manager qui veut des résultats','Atelier : « La frontière <em>invisible</em> »',
 '<div class="row" style="flex:1"><div class="card story rv t-c" style="flex:1.15"><p>'+sp('Sophie travaille depuis trois ans dans une entreprise.')+' '+sp('Son nouveau manager, Marc, lui fixe des objectifs élevés.')+'</p><p>'+sp('Depuis deux mois, il critique systématiquement ses résultats devant l\'équipe,')+' '+sp('lui retire certains dossiers sans explication')+' '+sp('et lui envoie régulièrement des messages dévalorisants.')+'</p><p>'+sp('Sophie ne prend plus la parole en réunion.')+' '+sp('Elle commence à éviter son manager.')+'</p><div style="font-size:16px;color:var(--muted);margin-top:6px">'+I('pen')+' Cliquez sur une phrase pour la surligner comme fait observable.</div></div>'+
 '<div class="col" style="flex:1"><div class="lead" style="font-size:21px;font-weight:900;color:var(--deep)">Questions à travailler en sous-groupes :</div><div class="qlist">'+['Quels sont les faits observables ?','Qu\'est-ce qui relève du pouvoir normal de direction ?','Quels comportements posent problème ?','Quelles informations supplémentaires faudrait-il recueillir ?','Quelles premières mesures seraient adaptées ?'].map(function(t){return li(t,0,'target')}).join('')+'</div><div style="margin-top:auto"><button type="button" class="btn p cb" data-corr="c14">Éléments de correction</button></div></div></div>'+
 '<div class="corr" id="c14"><div class="k" style="color:var(--cy2);margin-bottom:6px">Éléments de correction</div>La <b>fixation d\'objectifs</b> et l\'<b>évaluation du travail</b> relèvent normalement du management. En revanche, les <b>humiliations répétées</b>, les <b>messages dévalorisants</b> et les <b>retraits injustifiés de dossiers</b> sont des éléments d\'alerte. Il faut recueillir les faits, examiner les circonstances, protéger la salariée si nécessaire et déclencher le traitement approprié <b>sans préjuger de la conclusion</b>.<div style="margin-top:12px"><button type="button" class="btn" style="background:transparent;color:#fff;border-color:#fff" data-corr="c14">Masquer</button></div></div>',14)});
/* ---------- PARTIE 3 ---------- */
divider(2);
add({id:'s15',n:15,part:2,t:'Ce que prévoit le Code du travail',html:frame(2,'Cadre légal','Ce que prévoit le <em>Code du travail</em>',
 '<table class="tbl" style="flex:none;border-spacing:0 6px"><tbody>'+[['Harcèlement moral','L1152-1'],['Harcèlement sexuel','L1153-1'],['Agissements sexistes','L1142-2-1'],['Prévention des risques professionnels','L4121-1 et L4121-2'],['Protection contre les mesures de rétorsion','L1152-2 et L1153-2'],['Référent désigné par le CSE','L2314-1'],['Référent employeur à partir de 250 salariés','L1153-5-1']].map(function(r,i){return '<tr class="rv"><td style="background:'+['#17365D','#C21790','#00899E','#17365D','#00899E','#17365D','#C21790'][i]+';width:auto;font-size:23px;padding:10px 20px;border-radius:12px 0 0 12px">'+r[0]+'</td><td style="font-weight:900;font-size:25px;color:var(--deep);width:300px;padding:10px 20px">'+r[1]+'</td></tr>'}).join('')+'</tbody></table>'+
 '<div class="note rv" style="font-size:22px;padding:11px 20px">Le <b>Code pénal</b> prévoit également des infractions et des sanctions, notamment aux articles <b>222-33</b> et <b>222-33-2</b>.</div>',15)});
add({id:'s16',n:16,part:2,t:'Quelles sont les obligations de l\'employeur ?',html:frame(2,'Employeur','Quelles sont les obligations de <em>l\'employeur</em> ?',
 '<div class="lead" style="font-size:22px;color:var(--muted)">L\'employeur doit notamment :</div><div class="grid g2" style="flex:1;grid-template-rows:repeat(3,1fr)">'+['Prévenir les risques pour la santé physique et mentale.','Évaluer les risques et définir des mesures de prévention.','Informer les salariés sur les dispositions applicables.','Prendre les mesures nécessaires pour prévenir les faits de harcèlement.','Réagir lorsqu\'une situation préoccupante est portée à sa connaissance.','Mettre en œuvre les mesures de protection et de traitement appropriées.'].map(function(t,i){return '<div class="card rv" style="display:flex;gap:14px;align-items:center;padding:12px 18px">'+ib('check',i%2)+'<span style="font-size:23px;line-height:1.3;font-weight:700;color:var(--deep)">'+t+'</span></div>'}).join('')+'</div>'+
 '<div class="note m rv">La prévention ne consiste pas seulement à <b>afficher une interdiction</b> du harcèlement.</div>',16)});
add({id:'s17',n:17,part:2,t:'Les responsabilités de chacun',html:frame(2,'Qui fait quoi','Les responsabilités de <em>chacun</em>',
 '<div class="grid g5" style="flex:1">'+[['building','Employeur','Prévenir, protéger, traiter les alertes et prendre les mesures appropriées','t-n',0],['briefcase','Manager','Adopter des pratiques respectueuses, repérer les alertes et les transmettre aux interlocuteurs compétents','t-c',0],['file','RH','Conseiller, orienter et contribuer au traitement des situations selon ses attributions','t-m',1],['users','CSE et référents','Informer, orienter, exercer leurs missions et leurs prérogatives d\'alerte','t-n',0],['user','Salarié','Respecter les autres, signaler les situations préoccupantes et contribuer à la prévention','t-c',1]].map(function(c){return '<div class="card rsp rv '+c[3]+'" style="display:flex;flex-direction:column;gap:14px;padding:20px 16px">'+ib(c[0],c[4])+'<h3 style="font-size:30px">'+c[1]+'</h3><p style="font-size:21px">'+c[2]+'</p></div>'}).join('')+'</div>',17)});
add({id:'s18',n:18,part:2,t:'Les conséquences juridiques',html:frame(2,'Cadre légal','Les conséquences <em>juridiques</em>',
 '<div class="row" style="flex:1"><div class="col" style="flex:1.15"><div class="lead" style="font-size:22px;color:var(--muted)">Les faits de harcèlement peuvent entraîner :</div>'+['Des sanctions disciplinaires.','Une responsabilité civile ou prud\'homale.','Des sanctions pénales.','Des mesures de protection des salariés.','Des conséquences sur la validité de certaines décisions de l\'employeur.'].map(function(t){return li(t,0,'scale')}).join('')+'</div>'+
 '<div class="col" style="flex:1"><div class="rv" style="background:var(--deep);color:#fff;border-radius:20px;padding:24px 28px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px"><div class="dk-k">Droit pénal · peines de base</div><div style="display:flex;gap:24px;align-items:flex-end;flex-wrap:nowrap;white-space:nowrap"><div><div class="big" data-count="2">2</div><div style="font-size:23px">ans d\'emprisonnement</div></div><div><div class="big"><span data-count="30000" data-sep="1">30 000</span> €</div><div style="font-size:23px">d\'amende</div></div></div><div style="font-size:19px;line-height:1.4;color:#DDE6F0">pour le harcèlement moral au travail et pour le harcèlement sexuel, avec des aggravations possibles selon les circonstances.</div></div></div></div>'+
 '<div class="note rv" style="font-size:22px">Les responsabilités de <b>l\'auteur des faits</b> et celles de <b>l\'employeur</b> doivent être distinguées.</div>',18)});
add({id:'s19',n:19,part:2,t:'Quelles protections pour les personnes concernées ?',html:frame(2,'Protections','Quelles protections pour les <em>personnes concernées</em> ?',
 '<div class="row" style="flex:1"><div class="col" style="flex:1"><div class="card t-c rv" style="font-size:24px;line-height:1.45;flex:1;display:flex;align-items:center"><div>Le droit prévoit des protections, notamment pour les personnes ayant <b>subi</b>, <b>refusé de subir</b>, <b>relaté</b> ou <b>témoigné</b> de faits de harcèlement dans les conditions légales.</div></div></div>'+
 '<div class="col" style="flex:1"><div class="lead" style="font-size:22px;color:var(--muted)">Il faut également respecter :</div>'+['La présomption d\'innocence dans le cadre pénal.','Les droits de la personne mise en cause.','La confidentialité des informations dans la mesure applicable.','L\'impartialité du traitement.','La protection contre les représailles.'].map(function(t){return li(t,0,'shield')}).join('')+'</div></div>'+
 '<div class="note m rv">Signaler une situation ne signifie pas que <b>les faits sont déjà juridiquement établis</b>.</div>',19)});
var ACTS=['Accueillir le signalement','Préserver les éléments disponibles','Évaluer les mesures de protection nécessaires','Déterminer les modalités de traitement','Réaliser, si nécessaire, une enquête impartiale','Décider des mesures appropriées','Informer les personnes concernées dans le respect de leurs droits'];
var ACTORS=[['building','Employeur'],['briefcase','Manager'],['file','RH'],['users','CSE et référents']];
add({id:'s20',n:20,part:2,timer:15,t:'Atelier : Qui doit faire quoi ?',html:frame(2,'Atelier','Atelier : « Qui doit faire <em>quoi</em> ? »',
 '<div class="lead rv" style="font-size:21px"><b>Situation :</b> une collaboratrice informe son responsable RH qu\'un supérieur lui adresse depuis plusieurs semaines des messages déplacés. <b>Répartissez les actions</b> : cliquez sur une action, puis sur l\'acteur concerné.</div>'+
 '<div class="row rv" style="flex:1;min-height:0"><div class="col" id="pool" style="flex:0 0 450px;gap:6px;padding:12px;background:var(--row);border-radius:14px;border:2px solid var(--bd)">'+ACTS.map(function(a,i){return '<button type="button" class="act" data-act="'+i+'">'+a+'</button>'}).join('')+'</div>'+
 '<div class="grid g2" style="flex:1;gap:10px;grid-template-rows:1fr 1fr">'+ACTORS.map(function(a,i){return '<div class="zone" data-zone="'+i+'"><h4 style="margin:0 0 4px">'+I(a[0])+a[1]+'</h4><div class="zc" id="z'+i+'" style="display:flex;flex-wrap:wrap;gap:4px"></div></div>'}).join('')+'</div></div>'+
 '<div class="note rv" style="font-size:18px;padding:9px 18px;display:flex;justify-content:space-between;gap:18px;align-items:center"><span><b>Débriefing :</b> le rôle de chaque acteur dépend de l\'organisation et de ses procédures. Le traitement doit rester <b>proportionné, rigoureux et impartial</b>.</span><span style="display:flex;gap:8px;flex:none"><button type="button" class="btn p" style="font-size:15px;padding:6px 14px" data-auto="1">Répartition possible</button><button type="button" class="btn" style="font-size:15px;padding:6px 14px" data-reset="pool">Réinitialiser</button></span></div>',20)});
/* ---------- PARTIE 4 ---------- */
divider(3);
add({id:'s21',n:21,part:3,t:'Un salarié vient vous parler : que faire ?',html:frame(3,'Accueillir','Un salarié vient vous parler : <em>que faire</em> ?',
 '<div class="grid g2" style="flex:1;grid-template-rows:repeat(3,1fr);column-gap:30px">'+[['Écouter','sans interrompre ni minimiser.'],['Accueillir','la parole avec respect, sans tirer de conclusion immédiate.'],['Clarifier','les faits, les dates, les lieux et les personnes concernées.'],['Expliquer','les suites possibles et les limites de confidentialité.'],['Orienter','et transmettre aux personnes habilitées.'],['Protéger','en cas de risque immédiat et assurer un suivi adapté.']].map(function(s,i){return '<div class="stp rv'+(i%2?' m':'')+'" style="align-items:center"><div class="n">'+(i+1)+'</div><p style="padding:0;font-size:26px"><b style="color:'+(i%2?'var(--mag)':'var(--navy)')+'">'+s[0]+'</b> '+s[1]+'</p></div>'}).join('')+'</div>',21)});
add({id:'s22',n:22,part:3,t:'Les phrases à éviter et celles à privilégier',html:frame(3,'Les mots comptent','Les phrases à éviter et celles à <em>privilégier</em>',
 '<div class="lead" style="font-size:19px;color:var(--muted)">'+I('play')+' Cliquez sur une phrase pour découvrir la formulation à privilégier. Cliquez à nouveau pour revenir.</div><div class="fr" style="flex:1;grid-template-rows:repeat(5,1fr)">'+[['Tu es sûr de ne pas exagérer ?','Peux-tu me décrire ce qui s\'est passé ?'],['C\'est son caractère.','Quels comportements as-tu observés ?'],['Pourquoi n\'as-tu rien dit avant ?','Qu\'est-ce qui t\'amène à en parler aujourd\'hui ?'],['Je vais régler ça entre vous.','Nous allons identifier les suites appropriées.'],['Je te promets que personne ne saura rien.','Les informations seront partagées uniquement dans la mesure nécessaire au traitement.']].map(function(r){return '<div class="flip rv" data-flip tabindex="0" role="button" aria-pressed="false"><div class="a"><span class="pill" style="flex:none">À ÉVITER</span><span>«&nbsp;'+r[0]+'&nbsp;»</span></div><div class="b"><span class="pill" style="flex:none">À PRIVILÉGIER</span><span>«&nbsp;'+r[1]+'&nbsp;»</span></div></div>'}).join('')+'</div>',22)});
add({id:'s23',n:23,part:3,t:'Distinguer les faits, les ressentis et les interprétations',html:frame(3,'Écouter avec méthode','Distinguer les faits, les ressentis et les <em>interprétations</em>',
 '<div class="grid g3" style="flex:1">'+[['Fait rapporté','Lors des trois dernières réunions, mon responsable m\'a interrompu et a déclaré que mon travail était inutile.','#17365D','file','Ce qui s\'est dit ou passé, avec dates et lieux'],['Ressenti','Je me suis senti humilié et je redoute les réunions.','#C21790','heart','Ce que la personne éprouve'],['Interprétation','Mon responsable cherche à me pousser à démissionner.','#00899E','bulb','Le sens que la personne donne aux faits']].map(function(c){return '<div class="card rv" style="padding:0;overflow:hidden;display:flex;flex-direction:column"><div style="background:'+c[2]+';color:#fff;padding:14px 20px;display:flex;gap:10px;align-items:center;font-size:25px;font-weight:900;letter-spacing:.04em;text-transform:uppercase"><span style="font-size:30px;display:flex">'+I(c[3])+'</span>'+c[0]+'</div><div style="padding:20px;flex:1;display:flex;flex-direction:column;gap:14px"><div class="quote" style="font-size:26px">'+c[1]+'</div><div style="margin-top:auto;font-size:18px;color:var(--muted);border-top:1px dashed var(--bd);padding-top:10px">'+c[4]+'</div></div></div>'}).join('')+'</div>'+
 '<div class="note rv" style="font-size:22px">Les trois éléments sont utiles pour comprendre une situation, mais ils <b>ne doivent pas être confondus</b>. Le ressenti mérite d\'être entendu ; les faits et le contexte doivent être examinés.</div>',23)});
add({id:'s24',n:24,part:3,t:'Que faire après un signalement ?',html:frame(3,'Après le signalement','Que faire après un <em>signalement</em> ?',
 '<div class="flow5 rv" style="flex:1">'+[['Accueillir et consigner','Écouter, noter les faits rapportés et informer des suites possibles.','#17365D'],['Protéger','Apprécier le risque immédiat et prendre sans attendre les mesures de protection nécessaires.','#17608A'],['Analyser','Examiner les faits et le contexte, puis choisir les modalités de traitement.','#00899E'],['Traiter','Si nécessaire, mener une enquête impartiale, dans le respect des droits de chacun.','#7B2A8A'],['Décider et suivre','Arrêter des mesures appropriées, informer les personnes concernées, assurer le suivi.','#C21790']].map(function(s,i){return '<div class="c" style="background:'+s[2]+'"><div class="nn">ÉTAPE '+(i+1)+'</div><h3>'+s[0]+'</h3><p>'+s[1]+'</p></div>'}).join('')+'</div>'+
 '<div class="note m rv" style="font-size:22px">Les mesures de protection peuvent être prises <b>dès le début</b> et adaptées pendant le traitement. Il ne faut pas attendre la fin d\'une enquête pour prévenir un <b>risque immédiat</b>.</div>',24)});
add({id:'s25',n:25,part:3,t:'Les erreurs à éviter',html:frame(3,'Les pièges','Les erreurs à <em>éviter</em>',
 '<div class="grid g2" style="flex:1;grid-template-rows:repeat(4,1fr);gap:12px">'+['Minimiser ou banaliser les propos rapportés.','Tirer une conclusion sans vérification.','Organiser systématiquement une confrontation.','Imposer une médiation.','Promettre un secret absolu.','Diffuser les informations à des personnes non concernées.','Laisser la personne seule face à la situation.','Sanctionner ou déplacer automatiquement la personne ayant signalé les faits.'].map(function(t){return '<div class="avoid rv" style="align-items:center">'+I('x')+'<span>'+t+'</span></div>'}).join('')+'</div>',25)});
add({id:'s26',n:26,part:3,timer:20,t:'Mise en situation : Je voudrais vous parler…',html:frame(3,'Mise en situation · Scénario','Mise en situation : « Je voudrais vous <em>parler…</em> »',
 '<div class="row" style="flex:1"><div class="col" style="flex:1.2"><div class="card t-m rv" style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px"><div class="k" style="color:var(--mag)">Camille demande à voir son manager</div><div class="quote" style="font-size:26px;font-weight:400;line-height:1.5">Je ne sais pas si je devrais vous en parler. Depuis quelque temps, un collègue fait des remarques sur ma tenue et m\'envoie des messages personnels. Je lui ai dit d\'arrêter, mais il continue. Je ne veux pas faire d\'histoires.</div></div></div>'+
 '<div class="col" style="flex:1"><div class="lead rv" style="font-size:21px;font-weight:900;color:var(--deep)">Travail en trinôme · 20 minutes</div>'+[['A','Camille','user','t-m'],['B','Manager accueillant le signalement','briefcase','t-n'],['C','Observateur','eye','t-c']].map(function(r){return '<div class="card rv '+r[3]+'" style="display:flex;gap:14px;align-items:center;padding:10px 18px"><div class="ico">'+I(r[2])+'</div><div style="font-size:23px;font-weight:700;line-height:1.2"><b style="color:var(--mag)">Personne '+r[0]+'</b> · '+r[1]+'</div></div>'}).join('')+'<div class="note rv" style="font-size:19px;padding:10px 18px">L\'observateur évalue : la <b>qualité de l\'écoute</b>, la <b>neutralité</b>, les <b>questions posées</b>, les <b>engagements formulés</b> et l\'<b>orientation proposée</b>.</div><div class="rv">'+cbtn('c26','Grille de correction')+'</div></div></div>'+
 drawer('c26','Repères d\'observation · pour le formateur',ul(['<b>Écoute</b> : laisser parler, reformuler, ne pas minimiser (« je ne veux pas faire d\'histoires »).','<b>Neutralité</b> : aucune conclusion ni jugement sur le collègue.','<b>Questions</b> : ouvertes et factuelles (quoi, quand, à quelle fréquence, quels messages, quels témoins).','<b>Engagements</b> : expliquer les suites et les limites de confidentialité, ne pas promettre le secret.','<b>Orientation</b> : transmettre aux personnes habilitées (RH, référent, CSE) et évaluer une protection immédiate.'],2)),26)});
add({id:'s27',n:27,part:3,t:'Débriefing collectif',html:frame(3,'Partage','Débriefing <em>collectif</em>',
 '<div class="row" style="flex:1"><div class="col" style="flex:1"><div class="lead" style="font-size:22px;color:var(--muted)">Chaque groupe partage :</div>'+['Une formulation qui a facilité la parole.','Une question particulièrement utile.','Une erreur ou une difficulté rencontrée.','Une mesure de protection ou d\'orientation pertinente.'].map(function(t){return li(t,0,'msg')}).join('')+'</div>'+
 '<div class="col" style="flex:1;justify-content:center"><div class="note m rv" style="font-size:24px;padding:24px 28px"><b>Message essentiel :</b> accueillir un signalement ne signifie pas se substituer à un enquêteur, à un médecin ou à un juge.</div></div></div>',27)});
/* ---------- PARTIE 5 ---------- */
divider(4);
add({id:'s28',n:28,part:4,t:'La prévention est une responsabilité collective',html:frame(4,'Trois niveaux de prévention','La prévention est une responsabilité <em>collective</em>',
 '<div class="col" style="flex:1;justify-content:space-between;gap:12px">'+[['Prévention primaire','Éviter l\'apparition des risques','Organisation du travail, règles claires, management respectueux, évaluation des risques.','#17365D','1'],['Prévention secondaire','Détecter et agir tôt','Sensibilisation, repérage des alertes, formation des managers, dispositifs de signalement.','#00899E','2'],['Prévention tertiaire','Limiter les conséquences','Protection, accompagnement, traitement des situations, prévention de leur répétition.','#C21790','3']].map(function(l,i){return '<div class="lvl rv" style="background:'+l[3]+';flex:1;margin-left:'+(i*0)+'px"><div class="bg">'+l[4]+'</div><div><div class="s">'+l[0]+'</div><h3>'+l[1]+'</h3><p>'+l[2]+'</p></div></div>'}).join('')+'</div>',28)});
add({id:'s29',n:29,part:4,t:'Les facteurs organisationnels à surveiller',html:frame(4,'Vigilance','Les facteurs organisationnels à <em>surveiller</em>',
 '<div class="grid g2" style="flex:1;grid-template-rows:repeat(4,1fr);gap:12px">'+['Objectifs contradictoires ou irréalistes.','Rôles et responsabilités mal définis.','Management fondé sur l\'humiliation ou la peur.','Concurrence interne excessive.','Tolérance des comportements déplacés.','Absence de dispositif de signalement connu.','Manque de réaction face aux premières alertes.'].map(function(t,i){return '<div class="card rv" style="display:flex;gap:14px;align-items:center;padding:10px 18px">'+ib('alert',i%2)+'<span style="font-size:24px;line-height:1.3;font-weight:700;color:var(--deep)">'+t+'</span></div>'}).join('')+'<div class="note rv" style="font-size:19px;display:flex;align-items:center">Ces facteurs peuvent accroître les risques, <b>sans établir à eux seuls</b> l\'existence d\'un harcèlement.</div></div>',29)});
var AUD=['Les salariés savent-ils quels comportements sont interdits ?','Savent-ils à qui s\'adresser ?','Les managers savent-ils accueillir une alerte ?','Les signalements sont-ils traités de manière impartiale ?','Les mesures de prévention sont-elles régulièrement réévaluées ?'];
add({id:'s30',n:30,part:4,t:'Construire un environnement de travail protecteur',html:frame(4,'Auto-diagnostic','Construire un environnement de travail <em>protecteur</em>',
 '<div class="lead" style="font-size:22px;color:var(--muted)">Une entreprise doit pouvoir répondre clairement à cinq questions. Répondez pour votre organisation :</div><div class="col" style="gap:8px;flex:1">'+AUD.map(function(q,i){return '<div class="aud rv"><p>'+(i+1)+'. '+q+'</p><div class="tri" data-aud="'+i+'"><button type="button" class="s0" data-v="0">Oui</button><button type="button" class="s1" data-v="1">En partie</button><button type="button" class="s2" data-v="2">Non</button></div></div>'}).join('')+'</div>'+
 '<div class="note rv" id="audres" style="font-size:22px">Répondez aux cinq questions pour obtenir votre synthèse.</div>',30)});
add({id:'s31',n:31,part:4,timer:15,t:'Atelier : notre plan de prévention',html:frame(4,'Atelier · En sous-groupes','Atelier : notre plan de <em>prévention</em>',
 '<div class="lead rv" style="font-size:21px">En sous-groupes, identifiez <b>trois actions</b> à mettre en place. Chaque groupe les présente en précisant le <b>responsable</b>, les <b>moyens</b> et l\'<b>échéance</b>.</div><div class="grid g3 rv" style="flex:1">'+[['Prévenir','Sensibiliser les équipes aux comportements inappropriés','t-c','shield',0],['Détecter','Faire connaître les interlocuteurs et les dispositifs d\'alerte','t-n','eye',0],['Réagir','Formaliser un protocole de traitement des signalements','t-m','flag',1]].map(function(c){return '<div class="card '+c[2]+'" style="padding:16px 20px;display:flex;flex-direction:column;gap:12px"><div style="display:flex;gap:12px;align-items:center">'+ib(c[3],c[4])+'<div style="font-size:30px;font-weight:900;color:var(--deep)">'+c[0]+'</div></div><div style="font-size:19px;color:var(--muted);font-weight:700">Exemple d\'action</div><div style="font-size:23px;line-height:1.35;color:var(--deep);font-weight:700">'+c[1]+'</div><div style="margin-top:auto;display:grid;gap:8px"><div class="avoid" style="padding:10px 14px;font-size:20px;background:var(--cyanl)"><b>Qui ?</b> Responsable</div><div class="avoid" style="padding:10px 14px;font-size:20px;background:var(--cyanl)"><b>Avec quoi ?</b> Moyens</div><div class="avoid" style="padding:10px 14px;font-size:20px;background:var(--cyanl)"><b>Pour quand ?</b> Échéance</div></div></div>'}).join('')+'</div><div class="rv">'+cbtn('c31','Exemples de plans')+'</div>'+
 drawer('c31','Exemples de plans · pour le formateur',ul(['<b>Prévenir</b> : sessions de sensibilisation des équipes, règles de comportement partagées, prise en compte des risques psychosociaux dans le DUERP.','<b>Détecter</b> : dispositif d\'alerte connu de tous, référents identifiés, managers formés à repérer les signaux faibles.','<b>Réagir</b> : protocole écrit de traitement, enquête impartiale, mesures de protection, information et suivi des personnes concernées.','<b>Pour chaque action</b> : un responsable nommé, des moyens réalistes et une échéance datée (par exemple sous trois mois).'],2)),31)});
add({id:'s32',n:32,part:4,timer:5,t:'Les engagements individuels',html:frame(4,'À partir de demain…','Les engagements <em>individuels</em>',
 '<div class="col" style="flex:1;justify-content:center;gap:16px">'+[['eye','Un comportement auquel je serai davantage attentif'],['pen','Une pratique que je souhaite modifier'],['flag','Une action que je peux engager dans mon équipe ou mon entreprise']].map(function(c,i){return '<div class="card rv t-'+['c','m','n'][i]+'" style="display:flex;gap:20px;align-items:center;padding:20px 26px">'+ib(c[0],i==1)+'<div style="font-size:28px;font-weight:900;color:var(--deep);line-height:1.2">'+c[1]+'</div></div>'}).join('')+'</div><div class="note rv" style="font-size:22px"><b>Temps individuel : 5 minutes</b>, suivi d\'un partage volontaire. Chacun note ses engagements sur son livret.</div><div class="rv">'+cbtn('c32','Exemples d\'engagements')+'</div>'+
 drawer('c32','Exemples d\'engagements · pour le formateur',ul(['Je ne banaliserai plus une plaisanterie ou une remarque sexiste.','Je noterai les faits que j\'observe plutôt que de les commenter.','Je saurai vers qui orienter une personne qui se confie.','Je proposerai à mon équipe un point sur les règles de comportement.'],2)),32)});
/* ---------- PARTIE 6 ---------- */
divider(5);
var QZ=[['Un seul acte suffit-il toujours à caractériser un harcèlement moral ?',0,'Non : le harcèlement moral suppose des agissements répétés.'],['Une pression grave pour obtenir un acte sexuel doit-elle obligatoirement être répétée ?',0,'Non : une pression grave peut suffire, même exercée une seule fois.'],['Un manager peut-il être l\'auteur d\'un harcèlement moral sans intention de nuire ?',1,'Oui : les agissements peuvent avoir pour objet ou pour effet de dégrader les conditions de travail.'],['Un témoin doit-il prouver juridiquement le harcèlement avant de signaler les faits ?',0,'Non : il n\'a pas à qualifier juridiquement les faits pour les faire remonter.'],['Une entreprise de 80 salariés doit-elle désigner un référent employeur au titre de l\'article L1153-5-1 ?',0,'Non : le référent employeur est obligatoire à partir de 250 salariés.'],['Un agissement sexiste doit-il obligatoirement être répété ?',0,'Non : un agissement sexiste peut être caractérisé sans répétition.']];
add({id:'s33',n:33,part:5,t:'Quiz final : testez vos connaissances',html:frame(5,'Quiz final','Testez vos <em>connaissances</em>',
 '<div class="grid g3" style="flex:1;grid-template-rows:1fr 1fr;gap:12px">'+QZ.map(function(q,i){return '<div class="card qz rv" data-q="'+i+'" data-a="'+q[1]+'"><div class="t">QUESTION '+(i+1)+'</div><p>'+q[0]+'</p><div class="yn"><button type="button" data-v="1">Oui</button><button type="button" data-v="0">Non</button></div><div class="ex">'+q[2]+'</div></div>'}).join('')+'</div>'+
 '<div class="row rv" style="align-items:center;gap:16px"><button type="button" class="btn p" id="qcorr" style="font-size:23px">Corriger mon quiz</button><button type="button" class="btn" id="qrst">Recommencer</button><div class="score" id="qscore"><span class="big" id="qn">0/6</span><span id="qmsg" style="font-size:22px;font-weight:700;color:var(--deep)"></span></div></div>',33)});
add({id:'s34',n:34,part:5,timer:15,t:'Étude de cas de synthèse',html:frame(5,'Étude de cas de synthèse','Une situation, <em>plusieurs responsabilités</em>',
 '<div class="row" style="flex:1"><div class="card story t-n rv" style="flex:1.05;display:flex;flex-direction:column;justify-content:center"><p>Dans une entreprise de <b>60 salariés</b>, plusieurs collaborateurs rapportent des <b>plaisanteries sexistes répétées</b> lors des réunions. Une salariée indique avoir demandé à plusieurs reprises que ces remarques cessent.</p><p style="margin:0">Le manager considère qu\'il s\'agit simplement de <b>« l\'ambiance habituelle de l\'équipe »</b>.</p></div>'+
 '<div class="col" style="flex:1"><div class="lead" style="font-size:21px;font-weight:900;color:var(--deep)">Questions :</div>'+['Quels faits doivent être examinés ?','Quels risques juridiques et humains identifiez-vous ?','Comment le manager devrait-il réagir ?','Quel rôle peuvent jouer les RH et le CSE ?','Quelles mesures immédiates et préventives proposer ?'].map(function(t,i){return '<div class="stp rv'+(i%2?' m':'')+'" style="align-items:center"><div class="n" style="width:38px;height:38px;font-size:19px">'+(i+1)+'</div><p style="padding:0;font-size:23px">'+t+'</p></div>'}).join('')+'<div class="rv" style="margin-top:6px">'+cbtn('c34','Éléments de correction')+'</div></div></div>'+
 drawer('c34','Éléments de correction · pour le formateur',ul(['<b>Faits</b> : fréquence et auteurs des plaisanteries, contexte des réunions, demandes répétées de la salariée, témoins, réaction du manager.','<b>Risques</b> : agissements sexistes (sans répétition nécessaire), possible harcèlement sexuel si les propos sont à connotation sexuelle répétée, environnement hostile, atteinte à la santé, responsabilité de l\'employeur.','<b>Manager</b> : ne pas banaliser, faire cesser les propos, rappeler les règles et transmettre aux personnes compétentes (RH, direction).','<b>RH et CSE</b> : accueillir la salariée, orienter, traiter la situation de manière impartiale ; référent désigné par le CSE (L2314-1).','<b>Mesures</b> : protéger la salariée, rappel des règles, sensibilisation de l\'équipe, suivi dans la durée.'],2)),34)});
add({id:'s35',n:35,part:5,t:'Les cinq réflexes à retenir',html:frame(5,'À retenir','Les cinq réflexes à <em>retenir</em>',
 '<div class="grid g5" style="flex:1">'+[['Ne pas banaliser','Une plaisanterie ou une habitude ne justifie pas un comportement dégradant.','t-n'],['Observer les faits','Identifier ce qui s\'est passé sans tirer de conclusion hâtive.','t-c'],['Écouter et orienter','Accueillir les signalements avec sérieux et neutralité.','t-m'],['Protéger et traiter','Mobiliser les personnes compétentes et les mesures adaptées.','t-n'],['Prévenir','Agir sur les comportements, les pratiques et l\'organisation.','t-c']].map(function(r,i){return '<div class="card rf rv '+r[2]+'" style="flex-direction:column;align-items:flex-start;gap:12px;padding:20px 16px"><div class="nb">0'+(i+1)+'</div><div><h3 style="font-size:27px">'+r[0]+'</h3><p style="font-size:21px">'+r[1]+'</p></div></div>'}).join('')+'</div>',35)});
add({id:'s36',n:36,part:5,cls:'dark div',bg:true,t:'Clôture',html:'<div class="chip"><img src="'+LOGO+'" alt="CAPSULE"></div><div class="dk-k" style="position:absolute;left:72px;top:150px">Clôture · Slide 36 / 36</div><div class="rv" style="position:absolute;left:72px;top:200px;width:1000px;font-size:57px;line-height:1.12;font-weight:900">Prévenir le harcèlement, ce n\'est pas attendre qu\'une personne <span style="color:var(--cy2)">ose parler.</span></div><div class="rv" style="position:absolute;left:72px;top:420px;width:980px;font-size:34px;line-height:1.35;color:#DDE6F0">C\'est créer les conditions pour que chacun puisse travailler dans le <b style="color:#fff">respect</b> et la <b style="color:#fff">sécurité</b>.</div><div class="rv" style="position:absolute;left:72px;bottom:70px;display:flex;gap:40px;font-size:25px;align-items:center"><b style="font-size:34px;letter-spacing:.06em">CAPSULE</b><span>www.cap-sule.fr</span><span>01 60 15 21 09</span><span>cap@cap-sule.fr</span></div><div style="position:absolute;right:56px;bottom:62px"><button class="btn" type="button" data-go="first" style="border-color:#fff;color:#fff;background:transparent">↺ Revenir au début</button></div>'});
/* ---------- moteur ---------- */
var st=document.getElementById('stage'),tmEl=document.getElementById('tm');
var els=S.map(function(s,i){var d=document.createElement('section');d.className='slide '+(s.cls||'');d.id='sl-'+s.id;d.setAttribute('aria-label',plain(s.t));if(s.bg){d.style.backgroundImage='url('+WAVE+')'}d.innerHTML=s.html;st.insertBefore(d,tmEl);return d});
var cur=-1,TOT=S.length,prog=document.getElementById('prog');
S.forEach(function(s,i){var b=document.createElement('i');b.title=plain(s.t);b.addEventListener('click',function(){go(i)});prog.appendChild(b)});
function rvs(i){return Array.prototype.slice.call(els[i].querySelectorAll('.rv'))}
function revealed(i){return rvs(i).filter(function(e){return e.classList.contains('in')}).length}
function updChip(){var r=rvs(cur),left=r.length-revealed(cur),c=document.getElementById('stepchip');c.textContent=left>0?'▸ '+left+' à afficher':'';}
function setProg(){var b=prog.children;for(var j=0;j<b.length;j++){b[j].className=j<cur?'done':j==cur?'cur':''}document.getElementById('cnt').textContent=(cur+1)+' / '+TOT}
function go(i,back){
 if(i<0||i>=TOT)return;
 if(cur>=0){els[cur].classList.remove('on','back');els[cur].querySelectorAll('.corr.on').forEach(function(x){x.classList.remove('on')});els[cur].querySelectorAll('.cb').forEach(function(b){b.style.visibility='visible'})}
 var prev=cur;cur=i;var e=els[i];
 if(back===undefined)back=prev>i;
 rvs(i).forEach(function(x){if(back)x.classList.add('in');else x.classList.remove('in')});
 e.classList.toggle('back',!!back);e.classList.add('on');
 setProg();updChip();setTimerFor(i);countUp(e,back);
 try{history.replaceState(null,'','#'+S[i].id)}catch(_){}
}
function countUp(e,back){e.querySelectorAll('[data-count]').forEach(function(n){var to=+n.getAttribute('data-count'),sep=n.getAttribute('data-sep'),t0=performance.now();function f(t){var p=Math.min(1,(t-t0)/1400),v=Math.round(to*(1-Math.pow(1-p,3)));n.textContent=sep?v.toLocaleString('fr-FR'):v;if(p<1&&!back)requestAnimationFrame(f)}if(window.matchMedia('(prefers-reduced-motion:reduce)').matches||back){n.textContent=sep?to.toLocaleString('fr-FR'):to}else requestAnimationFrame(f)})}
function next(){var r=rvs(cur),h=r.filter(function(x){return !x.classList.contains('in')});if(h.length){h[0].classList.add('in');updChip();return}go(cur+1,false)}
function prevf(){var r=rvs(cur),sh=r.filter(function(x){return x.classList.contains('in')});if(sh.length&&cur>0&&false){}go(cur-1,true)}
/* échelle */
function fit(){var vw=window.innerWidth,vh=window.innerHeight-56,s=Math.min(vw/1280,vh/720);st.style.transform='scale('+s+')';document.getElementById('viewport').style.paddingBottom='56px';}
window.addEventListener('resize',fit);fit();
/* clavier et gestes */
document.addEventListener('keydown',function(ev){
 var t=ev.target&&ev.target.tagName;if(t==='INPUT'||t==='TEXTAREA')return;
 var ov=document.getElementById('ov');
 if(ev.key==='Escape'){if(!ov.hidden)ov.hidden=true;return}
 if(!ov.hidden)return;
 if(ev.key==='ArrowRight'||ev.key==='PageDown'||(ev.key===' '&&t!=='BUTTON')){ev.preventDefault();next()}
 else if(ev.key==='ArrowLeft'||ev.key==='PageUp'){ev.preventDefault();prevf()}
 else if(ev.key==='Home')go(0);else if(ev.key==='End')go(TOT-1);
 else if(ev.key==='g'||ev.key==='G')openOv();
 else if(ev.key==='f'||ev.key==='F')fs();
 else if(ev.key==='c'||ev.key==='C'){var dd=els[cur].querySelector('.corr');if(dd)toggleCorr(dd.id)}
});
var tx=null;st.addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
st.addEventListener('touchend',function(e){if(tx===null)return;var dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>60){dx<0?next():prevf()}},{passive:true});
function fs(){try{var d=document.documentElement;if(document.fullscreenElement){document.exitFullscreen()}else if(d.requestFullscreen){d.requestFullscreen().catch(function(){})}}catch(_){}}
document.getElementById('bnext').addEventListener('click',next);document.getElementById('bprev').addEventListener('click',prevf);document.getElementById('bfs').addEventListener('click',fs);
/* plan */
function openOv(){var o=document.getElementById('ov'),b=document.getElementById('ovb'),h='';PARTS.forEach(function(p,pi){h+='<div class="pn">'+p.s+' · '+p.t+' · '+p.d+'</div><div class="gr">';S.forEach(function(s,i){if(s.part===pi&&s.n)h+='<button type="button" data-i="'+i+'"><b>'+s.n+'</b><span>'+plain(s.t)+'</span></button>'});h+='</div>'});b.innerHTML='<div class="gr" style="margin-top:14px"><button type="button" data-i="0"><b>▸</b><span>Ouverture</span></button></div>'+h;o.hidden=false}
document.getElementById('bgrid').addEventListener('click',openOv);document.getElementById('ovx').addEventListener('click',function(){document.getElementById('ov').hidden=true});
document.getElementById('ovb').addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(b){document.getElementById('ov').hidden=true;go(+b.getAttribute('data-i'),false);rvs(cur).forEach(function(x){x.classList.add('in')});updChip()}});
/* minuteur */
var tmS={},tmI=null,tmRun=false,tmCur=null;
function fmt(s){var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function tmDraw(){var s=tmS[tmCur];document.getElementById('tmt').textContent=fmt(s.left);tmEl.classList.toggle('end',s.left===0);document.getElementById('tmp').textContent=tmRun?'Pause':(s.left===0?'Terminé':'Démarrer')}
function tmStop(){tmRun=false;clearInterval(tmI);tmI=null}
function setTimerFor(i){tmStop();var m=S[i].timer;if(!m){tmEl.classList.remove('on');tmCur=null;return}tmCur=i;if(!tmS[i])tmS[i]={def:m*60,left:m*60};tmEl.classList.add('on');tmDraw()}
document.getElementById('tmp').addEventListener('click',function(){if(tmCur===null)return;var s=tmS[tmCur];if(tmRun){tmStop();tmDraw();return}if(s.left<=0)return;tmRun=true;tmI=setInterval(function(){s.left=Math.max(0,s.left-1);if(s.left===0)tmStop();tmDraw()},1000);tmDraw()});
document.getElementById('tmr').addEventListener('click',function(){if(tmCur===null)return;tmStop();tmS[tmCur].left=tmS[tmCur].def;tmDraw()});
document.getElementById('tmq').addEventListener('click',function(){if(tmCur===null)return;var s=tmS[tmCur];s.left+=300;s.def=Math.max(s.def,s.left);tmDraw()});
document.getElementById('tmm').addEventListener('click',function(){if(tmCur===null)return;var s=tmS[tmCur];s.left=Math.max(0,s.left-300);tmDraw()});
/* interactions */
var sel=null;
st.addEventListener('click',function(ev){
 var t=ev.target;
 var b=t.closest('[data-go]');if(b){go(b.getAttribute('data-go')==='first'?0:cur+1,false);return}
 var a=t.closest('[data-add]');if(a){var id=a.getAttribute('data-add'),inp=document.getElementById(id+'i'),v=inp.value.trim();if(v){var sp=document.createElement('span');sp.textContent=v;sp.style.setProperty('--r',((Math.random()*4-2).toFixed(1))+'deg');document.getElementById(id+'s').appendChild(sp);inp.value=''}inp.focus();return}
 var o=t.closest('.opt');if(o&&!o.disabled){var si=o.getAttribute('data-sit'),all=st.querySelectorAll('.opt[data-sit="'+si+'"]');all.forEach(function(x){x.disabled=true;if(x.getAttribute('data-r')==='1')x.classList.add('ok')});var ok=o.getAttribute('data-r')==='1';if(!ok)o.classList.add('ko');var cj=st.querySelector('.opt.ok[data-sit="'+si+'"]').getAttribute('data-j');var fb=document.getElementById('fb'+si+'_'+cj);fb.className='fb on '+(ok?'ok':'ko');fb.innerHTML=(ok?'<b>Bonne analyse.</b> ':'<b>Pas tout à fait. Bonne réponse (en vert) :</b> ')+fb.innerHTML;return}
 var f=t.closest('[data-flip]');if(f){f.classList.toggle('on');f.setAttribute('aria-pressed',f.classList.contains('on'));return}
 var s=t.closest('.story .s');if(s){s.classList.toggle('hl');return}
 var cr=t.closest('[data-corr]');if(cr){toggleCorr(cr.getAttribute('data-corr'));return}
 var ac=t.closest('.act');if(ac){if(ac.classList.contains('put')){document.getElementById('pool').appendChild(ac);ac.classList.remove('put','sel');return}if(sel&&sel!==ac)sel.classList.remove('sel');ac.classList.toggle('sel');sel=ac.classList.contains('sel')?ac:null;return}
 var z=t.closest('.zone');if(z&&sel){var zc=z.querySelector('.zc');zc.appendChild(sel);sel.classList.remove('sel');sel.classList.add('put');sel=null;return}
 var au=t.closest('[data-auto]');if(au){autoPlace();return}
 var rs=t.closest('[data-reset]');if(rs){var pool=document.getElementById('pool');st.querySelectorAll('.act.put,.act.sel').forEach(function(x){x.classList.remove('put','sel');pool.appendChild(x)});sel=null;return}
 var tv=t.closest('.tri button');if(tv){var tr=tv.parentNode;tr.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});tv.classList.add('on');audSum();return}
 var yn=t.closest('.qz .yn button');if(yn){var q=yn.closest('.qz');if(q.classList.contains('rok')||q.classList.contains('rko'))return;q.querySelectorAll('.yn button').forEach(function(x){x.classList.remove('sel')});yn.classList.add('sel');return}
 if(t.closest('#qcorr')){var n=0,ans=0;st.querySelectorAll('.qz').forEach(function(q){var s2=q.querySelector('.yn button.sel');var good=q.getAttribute('data-a');q.querySelectorAll('.yn button').forEach(function(b2){if(b2.getAttribute('data-v')===good)b2.classList.add('good')});if(s2){ans++;var okq=s2.getAttribute('data-v')===good;if(okq)n++;else s2.classList.add('bad');q.classList.add(okq?'rok':'rko')}else{q.classList.add('rko')}});var sc=document.getElementById('qscore');sc.classList.add('on');document.getElementById('qn').textContent=n+'/6';document.getElementById('qmsg').textContent=n===6?'Excellent : tous les réflexes sont acquis.':n>=4?'Très bien : relisez les points manqués.':'À consolider : reprenez les slides 3, 4, 5 et 15.';return}
 if(t.closest('#qrst')){st.querySelectorAll('.qz').forEach(function(q){q.classList.remove('rok','rko');q.querySelectorAll('.yn button').forEach(function(b2){b2.classList.remove('sel','good','bad')})});document.getElementById('qscore').classList.remove('on');return}
 if(t.closest('button,input,textarea,a,#tm,.corr,.zone,.pad,label'))return;
 next();
});
st.addEventListener('keydown',function(ev){if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[data-flip]')){ev.preventDefault();ev.target.click()}if(ev.key==='Enter'&&ev.target.tagName==='INPUT'){var b=ev.target.parentNode.querySelector('[data-add]');if(b)b.click()}});
function toggleCorr(id){var dr=document.getElementById(id);if(!dr)return;dr.classList.toggle('on');var on=dr.classList.contains('on');dr.parentNode.querySelectorAll('.cb[data-corr="'+id+'"]').forEach(function(b){b.style.visibility=on?'hidden':'visible'})}
var AUTO=[2,2,0,0,0,0,2];
function autoPlace(){var pool=document.getElementById('pool');st.querySelectorAll('.act.put,.act.sel').forEach(function(x){x.classList.remove('put','sel');pool.appendChild(x)});sel=null;pool.querySelectorAll('.act').forEach(function(a,i){var z=document.getElementById('z'+AUTO[+a.getAttribute('data-act')]);setTimeout(function(){z.appendChild(a);a.classList.add('put')},120*i)})}
function audSum(){var v=[],n=0,p=0,k=0;st.querySelectorAll('.tri').forEach(function(t){var on=t.querySelector('button.on');if(on){var x=+on.getAttribute('data-v');if(x===0)n++;else if(x===1)p++;else k++}});var d=n+p+k,r=document.getElementById('audres');if(d<5){r.innerHTML='<b>'+d+'/5</b> réponses. Répondez aux cinq questions pour obtenir votre synthèse.';r.className='note rv in'}else{var w=p+k;r.className='note rv in'+(w?' m':'');r.innerHTML=w?'<b>'+w+' question'+(w>1?'s':'')+' à travailler</b> sur 5 ('+k+' « non », '+p+' « en partie »). Ce sont vos priorités pour l\'atelier suivant.':'<b>Cinq « oui »</b> : votre dispositif est solide. Vérifiez qu\'il est connu de tous et régulièrement réévalué.'}}
/* démarrage */
function fromHash(){var h=(location.hash||'').replace('#','');for(var i=0;i<S.length;i++){if(S[i].id===h)return i}return 0}
window.addEventListener('hashchange',function(){var i=fromHash();if(i!==cur){go(i,false);rvs(i).forEach(function(x){x.classList.add('in')});updChip()}});
var i0=fromHash();go(i0,false);if(i0>0){rvs(i0).forEach(function(x){x.classList.add('in')});updChip()}
})();
</script>
